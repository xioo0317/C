name: Build & Test

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Vendor nlohmann_json
        run: |
          # 移除脚本里 Windows CRLF 的 \r 回车字符
          sed -i 's/\r$//' scripts/fetch_deps.sh
          bash scripts/fetch_deps.sh


      - name: Build with ndk-build (arm64-v8a)
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)
          echo "Build complete: $(ls -lh libs/arm64-v8a/local_api)"

      - name: Verify binary
        run: |
          file libs/arm64-v8a/local_api
          file libs/arm64-v8a/local_api | grep -q "ELF 64-bit.*aarch64" && echo "✓ ARM64 binary verified" || (echo "✗ Not an ARM64 binary"; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-api-android-arm64-v8a
          path: libs/arm64-v8a/local_api
          retention-days: 7
